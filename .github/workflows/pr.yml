# Build and test on every pull request.
name: PR Build and Test

on:
  pull_request:
    branches: [master, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Run tests
        run: go test -mod=vendor -v -race ./...

      - name: Build
        run: go build -mod=vendor -v .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest

  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push PR image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/iptv-proxy2:pr-${{ github.event.pull_request.number }}

      - name: Comment on PR with test instructions
        uses: actions/github-script@v7
        with:
          script: |
            const image = `${{ secrets.DOCKERHUB_USERNAME }}/iptv-proxy2:pr-${{ github.event.pull_request.number }}`;
            const body = [
              '<!-- pr-docker-test -->',
              '## Test this PR locally with Docker',
              '',
              '```bash',
              `docker pull ${image}`,
              `docker run --rm -p 8080:8080 -p 8081:8081 \\`,
              `  --env-file ~/.config/iptv-proxy/env \\`,
              `  ${image} \\`,
              `  --hostname localhost --port 8080 --ui-port 8081`,
              '```',
              '',
              'Reads credentials from `~/.config/iptv-proxy/env` — set `IPTV_PROXY_XTREAM_BASE_URL`, `IPTV_PROXY_XTREAM_USER`, `IPTV_PROXY_XTREAM_PASSWORD` (or `IPTV_PROXY_M3U_URL` for M3U).',
              '',
              'Configuration UI: http://localhost:8081',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            const existing = comments.find(c => c.body.includes('<!-- pr-docker-test -->'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: npm install
        working-directory: web/frontend

      - name: Build frontend
        run: npm run build
        working-directory: web/frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: web/frontend

      - name: Run e2e tests
        run: npm run e2e
        working-directory: web/frontend
        env:
          CI: true
